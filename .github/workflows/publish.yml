name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # No build step — both packages ship their bin/ sources as-is.
      # Install only validates the lockfile.
      - run: pnpm install --frozen-lockfile

      # npmjs.com publishes use Trusted Publishing (OIDC).
      # No NPM_TOKEN — auth is brokered via the id-token written for this job.
      # Requires a trusted publisher registered on npmjs.com for BOTH
      # webim-plugin and create-webim-plugin pointing at:
      # repo=morsaken/webim-plugin, workflow=publish.yml.
      # webim-plugin goes first: create-webim-plugin depends on it.
      - name: Publish webim-plugin to npmjs.com
        run: pnpm publish --access public --no-git-checks

      - name: Publish create-webim-plugin to npmjs.com
        working-directory: create-webim-plugin
        run: pnpm publish --access public --no-git-checks

      - name: Find previous tag
        if: startsWith(github.ref, 'refs/tags/')
        id: prev
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)
          echo "previous_tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV:-<none>}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          previous_tag: ${{ steps.prev.outputs.previous_tag }}
